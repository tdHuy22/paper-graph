[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-graph"
version = "0.1.0"
description = "Sơ đồ nhiều tầng cho bài báo, mỗi ô neo về đúng câu trong bài"
requires-python = ">=3.11"
dependencies = []  # lõi chỉ dùng thư viện chuẩn; extract, figure cần PyMuPDF của VietPaper

[tool.setuptools]
packages = ["paper_graph"]

[tool.setuptools.package-data]
paper_graph = ["viewer/*"]
